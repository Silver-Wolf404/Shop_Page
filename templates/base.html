<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}母婴商城{% endblock %}</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Microsoft YaHei', Arial, sans-serif;
            background-color: #fff;
            color: #333;
        }
        .header {
            background: white;
            padding: 1rem 0;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
        }
        .header-content {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .logo {
            font-size: 1.5rem;
            font-weight: bold;
            background: linear-gradient(135deg, #f8bbd0 0%, #d1c4e9 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            text-decoration: none;
        }
        .logo::before {
            content: "👶";
            font-size: 1.8rem;
            -webkit-text-fill-color: #f8bbd0;
        }
        .nav {
            display: flex;
            gap: 3rem;
        }
        .nav a {
            color: #333;
            text-decoration: none;
            transition: color 0.3s;
            font-size: 0.95rem;
        }
        .nav a:hover, .nav a.active {
            color: #d1c4e9;
        }
        .search-bar {
            display: flex;
            align-items: center;
        }
        .search-input {
            width: 300px;
            padding: 8px 15px;
            border: 2px solid #d1c4e9;
            border-right: none;
            border-radius: 4px 0 0 4px;
            font-size: 0.85rem;
        }
        .search-input:focus {
            outline: none;
        }
        .search-btn {
            background: #d1c4e9;
            color: white;
            border: 2px solid #d1c4e9;
            width: 50px;
            height: 33px;
            border-radius: 0 4px 4px 0;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.3s;
        }
        .search-btn:hover {
            background: #b39ddb;
            border-color: #b39ddb;
        }
        .footer {
            background: #333;
            color: #ccc;
            padding: 2rem 0;
            margin-top: 3rem;
        }
        .footer-services {
            display: flex;
            justify-content: space-around;
            padding-bottom: 2rem;
            border-bottom: 1px solid #444;
            margin-bottom: 2rem;
        }
        .service-item {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            color: #fff;
            font-size: 0.9rem;
        }
        .service-item .icon {
            font-size: 1.2rem;
        }
        .footer-links {
            display: flex;
            justify-content: center;
            gap: 2rem;
            font-size: 0.8rem;
            margin-bottom: 1rem;
        }
        .footer-links a {
            color: #ccc;
            text-decoration: none;
        }
        .footer-links a:hover {
            color: white;
        }
        .footer-copyright {
            text-align: center;
            font-size: 0.75rem;
            color: #666;
        }
        @media (max-width: 768px) {
            .header-content {
                flex-direction: column;
                gap: 1rem;
            }
            .nav {
                gap: 1.5rem;
            }
            .footer-services {
                flex-direction: column;
                gap: 1rem;
                align-items: center;
            }
        }
        {% block extra_css %}{% endblock %}
    </style>
</head>
<body>
    <header class="header">
        <div class="container">
            <div class="header-content">
                <a href="/" class="logo">母婴商城</a>
                <nav class="nav">
                    {% block nav %}
                    <a href="/" {% if current_page == 'index' %}class="active"{% endif %}>首页</a>
                    <a href="/commodity/" {% if current_page == 'commodity' %}class="active"{% endif %}>所有商品</a>
                    <a href="/shopper/" {% if current_page == 'shopper' %}class="active"{% endif %}>购物车</a>
                    {% if user.is_authenticated %}
                    <a href="/shopper/profile/" {% if current_page == 'profile' %}class="active"{% endif %}>个人中心</a>
                    <span style="color:#9c27b0">{{ user.username }}</span>
                    <a href="/shopper/logout/" style="color:#ff5722">退出</a>
                    {% else %}
                    <a href="/shopper/login/" {% if current_page == 'login' %}class="active"{% endif %}>登录</a>
                    {% endif %}
                    {% endblock %}
                </nav>
                <form action="/commodity/" method="GET" class="search-bar">
                    <input type="text" name="q" class="search-input" placeholder="请输入需要的商品" value="{{ search_query }}">
                    <button type="submit" class="search-btn">🔍</button>
                </form>
            </div>
        </div>
    </header>

    <main>
        {% block content %}{% endblock %}
    </main>

    <footer class="footer">
        <div class="container">
            <div class="footer-services">
                <div class="service-item">
                    <span class="icon">🛡️</span>
                    <span>7天无理由退换货</span>
                </div>
                <div class="service-item">
                    <span class="icon">🚚</span>
                    <span>满99元全场免邮</span>
                </div>
                <div class="service-item">
                    <span class="icon">💎</span>
                    <span>100%品质保证</span>
                </div>
            </div>
            <div class="footer-links">
                <a href="#">关于我们</a>
                <a href="#">帮助中心</a>
                <a href="#">售后服务</a>
                <a href="#">母婴资讯</a>
                <a href="#">关于欧洲</a>
            </div>
            <div class="footer-copyright">
                母婴商城版权所有 © 2012-2020
            </div>
        </div>
    </footer>
</body>
</html>
